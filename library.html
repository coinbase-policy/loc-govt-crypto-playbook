<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Library | Mayor Toolkit</title>
<style>
  :root {
    --cb-blue: #0052FF;
    --cb-dark: #0A0B0D;
    --cb-gray: #5B616E;
    --cb-bg: #FAFBFC;
    --cb-border: #E5E8EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: var(--cb-bg);
    color: var(--cb-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Navigation */
  .top-nav {
    background: white;
    border-bottom: 1px solid var(--cb-border);
    padding: 16px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-brand { font-weight: 700; font-size: 18px; color: var(--cb-dark); display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-link { color: var(--cb-gray); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
  .nav-link:hover { color: var(--cb-blue); }

  /* Library Container */
  .container { max-width: 1200px; margin: 48px auto 80px; padding: 0 24px; }
  
  .header { text-align: center; margin-bottom: 48px; }
  .header h1 { font-size: 36px; font-weight: 700; margin-bottom: 16px; }
  .header p { font-size: 18px; color: var(--cb-gray); max-width: 600px; margin: 0 auto; }

  /* Filters */
  .lib-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
    justify-content: center;
  }
  .lib-filter {
    background: white;
    border: 1px solid var(--cb-border);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--cb-gray);
    cursor: pointer;
    transition: all 0.2s;
  }
  .lib-filter:hover { border-color: var(--cb-gray); }
  .lib-filter.active {
    background: var(--cb-dark);
    color: white;
    border-color: var(--cb-dark);
  }

  /* Grid */
  .lib-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }
  .resource-card {
    background: white;
    border: 1px solid var(--cb-border);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }
  .resource-card:hover {
    border-color: var(--cb-blue);
    box-shadow: 0 4px 12px rgba(0,82,255,0.1);
    transform: translateY(-2px);
  }
  .resource-icon { font-size: 24px; margin-bottom: 16px; }
  .resource-type { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--cb-gray); text-transform: uppercase; margin-bottom: 8px; }
  .resource-title { font-size: 18px; font-weight: 700; color: var(--cb-dark); margin-bottom: 12px; line-height: 1.3; }
  .resource-desc { font-size: 14px; color: var(--cb-gray); margin-bottom: 24px; flex-grow: 1; }
  .resource-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--cb-border);
    padding-top: 16px;
    font-size: 13px;
    color: var(--cb-gray);
  }
  .resource-tag {
    background: var(--cb-light);
    color: var(--cb-blue);
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="nav-brand"><span style="color: var(--cb-blue);">🛡️</span> Mayor Toolkit</a>
    <div class="nav-links">
      <a href="StateScan-v2.html" target="_blank" class="nav-link" style="color: var(--cb-blue);">StateScan Tracker ⚡</a>
      <a href="index.html" class="nav-link">← Back to Home</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Resource Library</h1>
      <p>Browse our curated collection of briefings, research, and use cases designed specifically for local government leaders.</p>
    </div>

    <div class="lib-filters" id="libFilters">
      </div>

    <div class="lib-grid" id="libGrid">
      </div>
  </div>

  <script>
    const resources = [
      { tier: "essential", icon: "🌟", type: "Briefing", time: "15 min read", title: "Equipping Local Governments with Digital Assets and Blockchain", desc: "As cities and states grapple with the challenges of the 21st century, digital assets and blockchain offer innovative solutions.", category: "Foundational Briefings", url: "https://coinbase.com/public-policy/advocacy/documents/equipping-local-governments-with-crypto-and-blockchain" },
      { tier: "essential", icon: "🎓", type: "Briefing", time: "20 min read", title: "Crypto and Local Government", desc: "A foundational explainer on how crypto and blockchain technologies offer local governments new tools to operate more transparently.", category: "Foundational Briefings", url: "https://www.coinbase.com/en-de/public-policy/advocacy/documents/crypto-and-local-government" },
      { tier: "essential", icon: "🏢", type: "Briefing", time: "10 min read", title: "What are Decentralized Autonomous Organizations (DAOs)", desc: "DAOs are blockchain-based entities governed by smart contracts and collective decision-making.", category: "Foundational Briefings", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/what-are-daos" },
      { tier: "essential", icon: "💸", type: "Briefing", time: "12 min read", title: "Micro-Access and Micropayments", desc: "Much of the internet is structured around a simple constraint: payments are too expensive to be small.", category: "Payments & Remittances", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/micro-access-and-micropayments" },
      { tier: "essential", icon: "🌍", type: "Briefing", time: "15 min read", title: "Crypto and Remittances", desc: "Remittances are a vital lifeline for millions around the world, but face high fees and delays.", category: "Payments & Remittances", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/crypto-and-remittances" },
      { tier: "essential", icon: "📄", type: "Research", time: "25 min read", title: "Remittances Research Paper", desc: "A research paper explaining how crypto transfers can disrupt traditional remittance methods.", category: "Payments & Remittances", url: "https://assets.ctfassets.net/c5bd0wqjc7v0/PX9g1EAnHHAKlCg1zHCwX/f9dde71351c320a15fc4eecff83e14e8/Crypto___Remittances.pdf" },
      { tier: "essential", icon: "📈", type: "Research", time: "20 min read", title: "The Rise of Stablecoin Remittances", desc: "We examine Coinbase data and find that among crypto transfers that are possible remittances, stablecoins are playing an even greater role.", category: "Payments & Remittances", url: "https://assets.ctfassets.net/o10es7wu5gm1/62qK9UDQ7OleJUjPhYVBNB/7ac6fd079fbf94f350b52b83abcf26cb/POL25_StablecoinRemittances_V2.pdf" },
      { tier: "essential", icon: "💳", type: "Briefing", time: "15 min read", title: "Crypto and Payments", desc: "Crypto streamlines payments by enabling faster, cheaper, and borderless transactions.", category: "Payments & Remittances", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/micro-access-and-micropayments" },
      { tier: "essential", icon: "🌐", type: "Policy", time: "18 min read", title: "Stablecoins and the G20 Cross-border Payments Roadmap", desc: "The G20's cross-border payment reforms are falling short. Stablecoins already deliver faster, cheaper, and more transparent payments.", category: "Payments & Remittances", url: "https://ctf-images-01.coinbasecdn.net/o10es7wu5gm1/4AzxMLmPCBvOSPDV1IEAII/1a361fcc151d2d0ef109b8d81169a1fe/Let%C3%A2__s_embrace_stablecoins_and_achieve_the_goals_of_the_G20_Cross-border_Payments_Roadmap__1_.pdf" },
      { tier: "essential", icon: "🏦", type: "Briefing", time: "15 min read", title: "Onchain Lending", desc: "Among blockchain's most compelling applications is onchain lending, where smart contracts create a transparent alternative to conventional credit.", category: "Payments & Remittances", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/micro-access-and-micropayments" },
      { tier: "essential", icon: "🏗️", type: "Briefing", time: "15 min read", title: "Decentralized Physical Infrastructure (DePIN)", desc: "DePIN networks use blockchain technology to coordinate and incentivize the development of real-world infrastructure.", category: "Housing & Infrastructure", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/what-is-decentralized-physical-infrastructure" },
      { tier: "essential", icon: "🏠", type: "Briefing", time: "12 min read", title: "Crypto and Housing", desc: "Crypto and blockchain technologies offer the housing sector powerful tools to increase security, transparency, and efficiency.", category: "Housing & Infrastructure", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/crypto-and-housing" },
      { tier: "essential", icon: "🔑", type: "Briefing", time: "14 min read", title: "Housing and Financial Inclusion", desc: "Blockchain offers an opportunity to modernize housing finance in ways that improve efficiency.", category: "Housing & Infrastructure", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/blockchain-housing-and-financial-inclusion" },
      { tier: "essential", icon: "💼", type: "Briefing", time: "12 min read", title: "Blockchain Infrastructure for Independent Workers", desc: "Blockchain-based payment and recordkeeping rails offer a solution by providing portable financial infrastructure.", category: "Small Business & Economy", url: "https://www.coinbase.com/en-nl/public-policy/advocacy/documents/blockchain-infrastructure-for-independent-workers" },
      { tier: "essential", icon: "🏪", type: "Briefing", time: "15 min read", title: "Crypto and Small Business", desc: "Crypto and blockchain technology offer tools that can enable faster, cheaper, and more inclusive financial infrastructure for SMBs.", category: "Small Business & Economy", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/crypto-and-small-business" },
      { tier: "essential", icon: "🤝", type: "Briefing", time: "15 min read", title: "Empowering small businesses with digital assets", desc: "We explore how these technologies can make processes more accessible for small businesses.", category: "Small Business & Economy", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/crypto-and-small-business" },
      { tier: "essential", icon: "⚖️", type: "Mythbusting", time: "10 min read", title: "Crypto and Financial Inclusion", desc: "Crypto and blockchain are driving financial inclusion by empowering unbanked and underbanked Americans.", category: "Fact-Finding & Research", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-financial-inclusion" },
      { tier: "essential", icon: "🛡️", type: "Mythbusting", time: "10 min read", title: "Crypto and Illicit Finance", desc: "Crypto and blockchain can enhance financial security through transparent, traceable systems.", category: "Fact-Finding & Research", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-illicit-finance" },
      { tier: "essential", icon: "🇺🇸", type: "Mythbusting", time: "10 min read", title: "Crypto and Americans", desc: "Crypto owners represent a diverse range of backgrounds—and these Americans call for clearer digital asset regulations.", category: "Fact-Finding & Research", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-americans?bypass_cache=1&preview=true" },
      { tier: "essential", icon: "⚡", type: "Mythbusting", time: "10 min read", title: "Crypto and Energy", desc: "Crypto and blockchain technology can advance sustainable finance by incentivizing renewable energy projects.", category: "Fact-Finding & Research", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-energy" },
      { tier: "essential", icon: "🔒", type: "Mythbusting", time: "10 min read", title: "Crypto and Consumer Protection", desc: "User-friendly platforms and clear regulations can enhance consumer protection by making digital assets safer.", category: "Fact-Finding & Research", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-consumer-protection" },
      { tier: "essential", icon: "🕵️", type: "Research", time: "20 min read", title: "Zero Knowledge Proofs for the Bank Secrecy Act", desc: "ZKPs can preserve the integrity of financial compliance while dramatically improving privacy.", category: "Fact-Finding & Research", url: "https://assets.ctfassets.net/o10es7wu5gm1/6nQhqXCNlCFuwAiZ2acLTV/22cb8aa803581459c50622308cfdfa03/CBI_primer_ZKP_for_BSA.pdf" },
      { tier: "essential", icon: "🎥", type: "Video", time: "Various", title: "Coinbase Crypto University", desc: "Crypto University is on a mission to let the world onchain and crypto forward through education.", category: "Video & Media", url: "https://www.coinbase.com/en-gb/public-policy/advocacy/documents/fact-finding-crypto-and-financial-inclusion" }
    ];

    const categories = [
      "Foundational Briefings", 
      "Payments & Remittances", 
      "Housing & Infrastructure", 
      "Small Business & Economy", 
      "Fact-Finding & Research", 
      "Video & Media"
    ];

    function renderLibrary(filter = 'All') {
      const filtersDiv = document.getElementById('libFilters');
      filtersDiv.innerHTML = `<div class="lib-filter ${filter === 'All' ? 'active' : ''}" onclick="renderLibrary('All')">All Categories</div>` + 
        categories.map(c => `<div class="lib-filter ${filter === c ? 'active' : ''}" onclick="renderLibrary('${c}')">${c}</div>`).join('');

      const gridDiv = document.getElementById('libGrid');
      const filtered = filter === 'All' ? resources : resources.filter(r => r.category === filter);
      
      gridDiv.innerHTML = filtered.map(r => `
        <div class="resource-card" onclick="window.open('${r.url}', '_blank')">
          <div class="resource-icon">${r.icon}</div>
          <div class="resource-type">${r.type}</div>
          <div class="resource-title">${r.title}</div>
          <div class="resource-desc">${r.desc}</div>
          <div class="resource-meta">
            <span class="resource-tag">${r.category}</span>
            <span>${r.time}</span>
          </div>
        </div>
      `).join('');
    }

    // Initialize the library on page load
    renderLibrary();
  </script>
</body>
</html>
